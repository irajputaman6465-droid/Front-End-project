<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">Flipkart</div>

        <div class="search-bar">
            <input type="text" placeholder="Search for products, brands and more">
            <button>Search</button>
        </div>

        <div class="nav-items">
            <button class="login-btn">Login</button>
            <div class="more">More ▾</div>
            <div class="cart">Cart</div>
            <button id="toggleTheme">🌙</button>
        </div>
    </header>

    <!-- CATEGORY ROW -->
    <section class="categories">
        <div class="category">Electronics</div>
        <div class="category">Fashion</div>
        <div class="category">Home</div>
        <div class="category">Appliances</div>
        <div class="category">Toys</div>
        <div class="category">Grocery</div>
    </section>

    <!-- BANNER SLIDER -->
    <section class="banner-slider">
        <div class="slides">
            <img src="asset\banner-1.jpg" alt="banner1">
            <img src="asset\banner-2.jpg" alt="banner2">
            <img src="asset\banner-3.jpg" alt="banner3">
        </div>
        <button class="prev">❮</button>
        <button class="next">❯</button>
    </section>

    <!-- PRODUCT SECTION -->
    <section class="products">
        <h2>Trending Products</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="asset\moto-g35-front-and-back.png" alt="product1">
                <p class="product-title">Smartphone</p>
                <p class="product-price">₹9,999</p>
            </div>
            <div class="product-card">
                <img src="asset\headphone.jpg" alt="product2">
                <p class="product-title">Headphones</p>
                <p class="product-price">₹1,499</p>
            </div>
            <div class="product-card">
                <img src="asset\laptop.jpg" alt="product3">
                <p class="product-title">Laptop</p>
                <p class="product-price">₹49,999</p>
            </div>
            <div class="product-card">
                <img src="asset\shoes.webp" alt="product4">
                <p class="product-title">Shoes</p>
                <p class="product-price">₹1,299</p>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Flipkart Clone. All Rights Reserved.</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
